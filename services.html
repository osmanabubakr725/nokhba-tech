<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الخدمات | نخبة التقنية</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <header id="site-header" class="bg-white shadow sticky top-0 z-50"></header>
    <main>
    <section class="bg-gradient-to-br from-blue-600 to-blue-900 text-white">
    <div class="max-w-6xl mx-auto px-4 py-16 text-center">
      <h1 class="text-3xl md:text-5xl font-bold" data-i18n="services.title"></h1>
      <p class="mt-4 text-blue-100 max-w-2xl mx-auto" data-i18n="serv.desc"></p>
    </div>
  </section>

  <section class="max-w-6xl mx-auto px-4 py-16">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

      <div class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
        <div class="text-4xl">💻</div>
        <h3 class="mt-4 font-bold text-xl" data-i18n="svc.web"></h3>
        <p class="mt-2 text-slate-500 text-sm" data-i18n="serv.wed.desc"></p>
        <ul class="mt-4 space-y-1 text-sm">
          <li data-i18n="serv1.li">✓</li>
          <li data-i18n="serv2.li">✓</li>
          <li data-i18n="serv3.li">✓</li>
        </ul>
      </div>

      <div class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
        <div class="text-4xl">📱</div>
        <h3 class="mt-4 font-bold text-xl" data-i18n="svc.mobile"></h3>
        <p class="mt-2 text-slate-500 text-sm" data-i18n="serv.mob"></p>
        <ul class="mt-4 space-y-1 text-sm">
          <li data-i18n="serv.mob1">✓</li>
          <li data-i18n="serv.mob2">✓</li>
          <li data-i18n="serv.mob3">✓</li>
        </ul>
      </div>

      <div class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
        <div class="text-4xl">🛠️</div>
        <h3 class="mt-4 font-bold text-xl" data-i18n="svc.support"></h3>
        <p class="mt-2 text-slate-500 text-sm" data-i18n="serv.supp"></p>
        <ul class="mt-4 space-y-1 text-sm">
          <li data-i18n="serv.supp1">✓</li>
          <li data-i18n="serv.supp2">✓</li>
          <li data-i18n="serv.supp3">✓</li>
        </ul>
      </div>

      <div class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
        <div class="text-4xl">🔒</div>
        <h3 class="mt-4 font-bold text-xl" data-i18n="svc.security"></h3>
        <p class="mt-2 text-slate-500 text-sm" data-i18n="serv.secu"></p>
        <ul class="mt-4 space-y-1 text-sm">
          <li data-i18n="serv.secu1">✓</li>
          <li data-i18n="serv.secu2">✓</li>
          <li data-i18n="serv.secu3">✓</li>
        </ul>
      </div>

      <div class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
        <div class="text-4xl">☁️</div>
        <h3 class="mt-4 font-bold text-xl" data-i18n="svc.cloud"></h3>
        <p class="mt-2 text-slate-500 text-sm" data-i18n="serv.cloud"></p>
        <ul class="mt-4 space-y-1 text-sm">
          <li data-i18n="serv.cloud1">✓</li>
          <li data-i18n="serv.cloud2">✓</li>
          <li data-i18n="serv.cloud3">✓</li>
        </ul>
      </div>

      <div class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
        <div class="text-4xl">🎨</div>
        <h3 class="mt-4 font-bold text-xl" data-i18n="svc.brand"></h3>
        <p class="mt-2 text-slate-500 text-sm" data-i18n="serv.brand">هوية بصرية تعبّر عن علامتك.</p>
        <ul class="mt-4 space-y-1 text-sm">
          <li data-i18n="serv.brand1">✓</li>
          <li data-i18n="serv.brand2">✓</li>
          <li data-i18n="serv.brand3">✓</li>
        </ul>
      </div>

    </div>
  </section>

  <section class="bg-blue-50">
    <div class="max-w-6xl mx-auto px-4 py-14 text-center">
      <h2 class="text-2xl md:text-3xl font-bold">لم تجد ما تبحث عنه؟</h2>
      <a href="request.html" class="inline-block mt-6 bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700">اطلب خدمة مخصصة</a>
    </div>
  </section>
    </main>
  

  <footer id="site-footer" class="bg-slate-900 text-slate-300"></footer>
  <script src="js/layout.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
