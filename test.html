<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-10">

  <h1 id="title" class="text-3xl font-bold">مرحباً بك في نخبة التقنية</h1>
  <button id="btn" class="mt-4 border px-4 py-2 rounded">EN</button>

  <script>
    const translations = {
  ar: { welcome: 'مرحباً بك في نخبة التقنية', btn: 'EN' },
  en: { welcome: 'Welcome to Nokhba Tech',     btn: 'عربي' },
};

let currentLang = 'ar';

function applyLang(lang) {
  currentLang = lang;
  document.getElementById('title').textContent = translations[lang].welcome;
  document.getElementById('btn').textContent = translations[lang].btn;
}

document.getElementById('btn').addEventListener('click', () => {
  if (currentLang === 'ar') {
    applyLang('en');
  } else {
    applyLang('ar');
  }
});
  </script>
</body>
</html>
