<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title.index"></title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <body class="bg-slate-50 text-slate-800">

  <!-- الهيدر -->
  <header id="site-header" class="bg-white shadow sticky top-0 z-50"></header>

  <!-- مؤقتاً: محتوى الصفحة -->
  <main>
  <section class="bg-gradient-to-br from-blue-600 to-blue-900 text-white">
    <div class="max-w-6xl mx-auto px-4 py-20 md:py-32 text-center">
      <h1 class="text-3xl md:text-5xl font-bold leading-tight" data-i18n="hero.title"></h1>
      <p class="mt-6 text-lg md:text-xl text-blue-100 max-w-2xl mx-auto" data-i18n="hero.text"></p>
      <div class="mt-8 flex flex-col sm:flex-row gap-4 justify-center">
        <a href="request.html" class="bg-white text-blue-700 font-bold px-8 py-3 rounded-lg hover:bg-blue-50" data-i18n="hero.cta1"></a>
        <a href="services.html" class="border border-white px-8 py-3 rounded-lg hover:bg-white hover:text-blue-700" data-i18n="hero.cta2"></a>
      </div>
    </div>
  </section>

  <section class="max-w-6xl mx-auto px-4 py-16">
    <h2 class="text-2xl md:text-3xl font-bold text-center" data-i18n="services.title"></h2>
    <p class="text-center text-slate-500 mt-2" data-i18n="services.sub"></p>

    <div class="mt-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <div class="bg-white rounded-xl shadow p-6 text-center hover:shadow-lg transition">
        <div class="text-4xl">💻</div>
        <h3 class="mt-4 font-bold text-lg" data-i18n="svc.web"></h3>
        <p class="mt-2 text-sm text-slate-500" data-i18n="svc.web.d"></p>
      </div>
      <div class="bg-white rounded-xl shadow p-6 text-center hover:shadow-lg transition">
        <div class="text-4xl">📱</div>
        <h3 class="mt-4 font-bold text-lg" data-i18n="svc.mobile"></h3>
        <p class="mt-2 text-sm text-slate-500" data-i18n="svc.mobile.d"></p>
      </div>
      <div class="bg-white rounded-xl shadow p-6 text-center hover:shadow-lg transition">
        <div class="text-4xl">🛠️</div>
        <h3 class="mt-4 font-bold text-lg" data-i18n="svc.support"></h3>
        <p class="mt-2 text-sm text-slate-500" data-i18n="svc.support.d"></p>
      </div>
      <div class="bg-white rounded-xl shadow p-6 text-center hover:shadow-lg transition">
        <div class="text-4xl">🔒</div>
        <h3 class="mt-4 font-bold text-lg" data-i18n="svc.security"></h3>
        <p class="mt-2 text-sm text-slate-500" data-i18n="svc.security.d"></p>
      </div>
    </div>
  </section>

  <section class="bg-blue-50">
    <div class="max-w-6xl mx-auto px-4 py-14 text-center">
      <h2 class="text-2xl md:text-3xl font-bold" data-i18n="cta.title"></h2>
      <p class="mt-2 text-slate-600" data-i18n="cta.text"></p>
      <a href="request.html" class="inline-block mt-6 bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700" data-i18n="cta.btn"></a>
    </div>
  </section>
</main>
  <!-- الفوتر -->
  <footer id="site-footer" class="bg-slate-900 text-slate-300"></footer>

  <script src="js/layout.js"></script>
  <script src="js/i18n.js"></script>
</body>

</body>
</html>
