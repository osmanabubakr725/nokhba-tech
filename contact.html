<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title.contact">اتصل بنا | نخبة التقنية</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <header id="site-header" class="bg-white shadow sticky top-0 z-50"></header>

  <main>
    <section class="bg-gradient-to-br from-blue-600 to-blue-900 text-white">
      <div class="max-w-6xl mx-auto px-4 py-14 text-center">
        <h1 class="text-3xl md:text-5xl font-bold" data-i18n="contact.title"></h1>
        <p class="mt-4 text-blue-100" data-i18n="contact.sub"></p>
      </div>
    </section>

    <!-- بطاقات التواصل -->
    <section class="max-w-6xl mx-auto px-4 py-16">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">

        <div class="bg-white rounded-xl shadow p-6 text-center">
          <div class="text-4xl">✉️</div>
          <h3 class="mt-3 font-bold" data-i18n="contact.email"></h3>
          <p class="mt-2 text-sm text-slate-500" dir="ltr">info@nokhba.example</p>
        </div>

        <div class="bg-white rounded-xl shadow p-6 text-center">
          <div class="text-4xl">📞</div>
          <h3 class="mt-3 font-bold" data-i18n="contact.phone"></h3>
          <p class="mt-2 text-sm text-slate-500" dir="ltr">+966 50 000 0000</p>
        </div>

        <div class="bg-white rounded-xl shadow p-6 text-center">
          <div class="text-4xl">📍</div>
          <h3 class="mt-3 font-bold" data-i18n="contact.address"></h3>
          <p class="mt-2 text-sm text-slate-500" data-i18n="contact.address.v"></p>
        </div>

        <div class="bg-white rounded-xl shadow p-6 text-center">
          <div class="text-4xl">🕘</div>
          <h3 class="mt-3 font-bold" data-i18n="contact.hours"></h3>
          <p class="mt-2 text-sm text-slate-500" data-i18n="contact.hours.v"></p>
        </div>

      </div>

      <!-- زر واتساب -->
      <div class="mt-10 text-center">
        <a href="https://wa.me/966500000000" target="_blank" rel="noopener"
           class="inline-block bg-green-600 text-white font-bold px-8 py-3 rounded-lg hover:bg-green-700"
           data-i18n="contact.whatsapp"></a>
      </div>
    </section>

    <!-- الخريطة -->
    <section class="bg-white">
      <div class="max-w-6xl mx-auto px-4 py-16">
        <h2 class="text-2xl md:text-3xl font-bold text-center" data-i18n="contact.map"></h2>
        <div class="mt-8 rounded-xl overflow-hidden shadow">
          <iframe
            class="w-full h-72 md:h-96"
            loading="lazy"
            src="https://www.openstreetmap.org/export/embed.html?bbox=46.60%2C24.65%2C46.78%2C24.78&layer=mapnik&marker=24.7136%2C46.6753">
          </iframe>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="bg-slate-900 text-slate-300"></footer>

  <script src="js/layout.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
